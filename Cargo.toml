[workspace]
members = ["lib/baumhard", "lib/mandala_derive", "crates/maptool"]

[workspace.package]
license = "MPL-2.0"

[package]
name = "mandala"
version = "0.1.0"
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustc-hash = "2.1.2"
unicode-segmentation = "1.13.2"
wgpu = { version = "29.0", features = ["webgl"] }
bytemuck = "1.16"
glyphon = "0.11.0"
cosmic-text = "0.18.2"
tinyvec = "1.11.0"
# Alternative: https://crates.io/crates/ab_glyph
glam = {version = "0.32.1", features = ["serde"]}
futures = "0.3.32"
winit = "0.30.13"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
serde-lexpr = "0.1.3"
lazy_static = "1.5.0"
syn = "2.0.117"
log = { version = "0.4.29", features = ["release_max_level_off"] }
smol_str = "0.3.6"
strum = "0.27"
strum_macros = "0.27"
indextree = {version = "4.8.1", features = ["serde"]}
ttf-parser = "0.25.1"
baumhard = {path="./lib/baumhard"}
mandala_derive = {path="./lib/mandala_derive"}
# Cross-platform `Instant` — on native re-exports `std::time::Instant`;
# on wasm32 uses `performance.now()`. Needed because
# `std::time::Instant::now()` panics on `wasm32-unknown-unknown`
# ("time not implemented on this platform").
web-time = "1.1.0"

[build-dependencies]
walkdir = "2.5.0"
path-slash = "0.2.1"
ttf-parser = "0.25.1"
regex = "1.12.3"
lazy_static = "1.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
num_cpus = "1.17.0"
pollster = "0.4.0"
arboard = "3.6.1"
# IPC server (--ipc-port / --headless). Tokio is authorized HERE ONLY by
# explicit carve-out from `CODE_CONVENTIONS.md §3` "no tokio" rule (see
# `src/application/ipc/`). Runs on a dedicated `std::thread`. Native-only;
# the WASM build is unaffected.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.7", features = ["json", "macros", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
crossbeam-channel = "0.5"
png = "0.17"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
js-sys = "0.3.95"
web-sys = { version = "0.3.95", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Storage", "Location", "Performance", "EventTarget", "KeyboardEvent", "Response"] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
